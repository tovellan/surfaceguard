name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      confirm:
        description: Create a public GitHub release and attach the package tarball
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create package archive
        run: mkdir release-assets && npm pack --pack-destination release-assets
      - name: Stage and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_NOTES=".github/release-notes/${RELEASE_TAG}.md"
          test -f "$RELEASE_NOTES"
          gh release create "$RELEASE_TAG" release-assets/*.tgz --draft --verify-tag --title "SurfaceGuard $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
