name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      confirm:
        description: Create a public GitHub release and attach the package tarball
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create package archive
        run: mkdir release-assets && npm pack --pack-destination release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release-assets/*.tgz --verify-tag --title "SurfaceGuard $RELEASE_TAG" --notes-file .github/release-notes/v0.1.0.md
