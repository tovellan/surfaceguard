name: SurfaceGuard
description: Scan produced web artifacts against a versioned public-surface policy
author: Tovellan
inputs:
  artifact:
    description: Path to the produced artifact directory
    required: true
  policy:
    description: Path to a SurfaceGuard policy file
    required: true
  adapter:
    description: 'Adapter override: auto, astro, generic, nextjs, or vite'
    required: false
    default: auto
  sarif:
    description: Optional path for SARIF output
    required: false
outputs:
  findings:
    description: Number of retained finding details, bounded by the policy limit
  findings-truncated:
    description: Whether additional finding details were omitted
  observed-findings-at-least:
    description: Lower bound on findings observed during scan evaluation
  text-inspection:
    description: Text inspection completeness, either complete or incomplete
  failed:
    description: Whether findings met the configured failure threshold
runs:
  using: node24
  main: dist/action/action.cjs
branding:
  icon: shield
  color: orange
