name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      confirm:
        description: Create a repository release and attach the package tarball
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create package archive
        run: mkdir release-assets && npm pack --pack-destination release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_NOTES=".github/release-notes/${RELEASE_TAG#v}.md"
          test -f "$RELEASE_NOTES"
          gh release create "$RELEASE_TAG" release-assets/*.tgz --verify-tag --title "SurfaceGuard $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
