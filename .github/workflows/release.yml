name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      confirm:
        description: Create a public GitHub release and attach the package tarball
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.confirm && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted release workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve the exact protected tag commit
        id: trusted-release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          tag_ref="refs/tags/$RELEASE_TAG"
          git fetch --no-tags origin "$tag_ref:$tag_ref"
          git show-ref --verify --quiet "$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_payload=$(git cat-file tag "$tag_ref")
          tag_target=$(printf '%s\n' "$tag_payload" | sed -n '1s/^object //p')
          test "$(printf '%s\n' "$tag_payload" | sed -n '2s/^type //p')" = commit
          test "$(printf '%s\n' "$tag_payload" | sed -n '3s/^tag //p')" = "$RELEASE_TAG"
          release_commit=$(git rev-parse "$tag_ref^{commit}")
          test "$tag_target" = "$release_commit"
          test "$release_commit" = "$GITHUB_SHA"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Check out the exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:gate
      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create package archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets
          cp ".github/release-notes/${RELEASE_TAG}.md" release-assets/release-notes.md
      - name: Transfer verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surfaceguard-release-${{ inputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Retrieve verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surfaceguard-release-${{ inputs.tag }}
          path: release-assets
      - name: Stage and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-assets/*.tgz)
          test "${#archives[@]}" -eq 1
          test -f release-assets/release-notes.md
          gh release create "$RELEASE_TAG" "${archives[0]}" --draft --verify-tag --title "SurfaceGuard $RELEASE_TAG" --notes-file release-assets/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
